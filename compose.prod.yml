# Deployed by Dokploy as a Compose service (auto-deploy on push to main).
# Secrets come from the Dokploy Environment tab. Only `web` joins dokploy-network (Traefik).
name: mkt
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://mkt:${POSTGRES_PASSWORD}@postgres:5432/mkt
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  APP_BASE_URL: ${APP_BASE_URL}
  BETTER_AUTH_URL: ${APP_BASE_URL}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
  ALLOWED_GITHUB_LOGINS: ${ALLOWED_GITHUB_LOGINS}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  # Optional second AI provider (D28). Empty = every feature stays on Anthropic.
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  AI_MODEL_OVERRIDES: ${AI_MODEL_OVERRIDES:-}
  AI_CAPTURE_PROMPTS: ${AI_CAPTURE_PROMPTS:-}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
  FS_ROOT: /data
  PROVIDER_MODE: live
  SELF_IPS: ${SELF_IPS}
  MISSED_SLOT_GRACE_MIN: ${MISSED_SLOT_GRACE_MIN:-120}
  # ── M2+ (empty = unset; the config ignores empty values) ──
  MKT_KEK_V1_B64: ${MKT_KEK_V1_B64:-}
  MKT_KEK_V2_B64: ${MKT_KEK_V2_B64:-}
  MKT_KEK_ACTIVE: ${MKT_KEK_ACTIVE:-1}
  CONFIRM_TOKEN_SECRET: ${CONFIRM_TOKEN_SECRET:-}
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET: ${R2_BUCKET:-mkt-private}
  HEALTHCHECK_PING_URL: ${HEALTHCHECK_PING_URL:-}
  FIRSTPARTY_ANALYTICS_TOKEN: ${FIRSTPARTY_ANALYTICS_TOKEN:-}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  # Provider keys: optional env fallbacks. Settings -> Keys (the vault) is checked first (D19).
  UPLOAD_POST_API_KEY: ${UPLOAD_POST_API_KEY:-}
  UPLOAD_POST_WEBHOOK_SECRET: ${UPLOAD_POST_WEBHOOK_SECRET:-}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  EXA_API_KEY: ${EXA_API_KEY:-}
  BRAVE_API_KEY: ${BRAVE_API_KEY:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment: { POSTGRES_USER: mkt, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: mkt }
    volumes: [pg-data:/var/lib/postgresql]
    networks: [mkt]
    mem_limit: 1g
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mkt"], interval: 5s, retries: 20 }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Same settings as docker/redis/redis.conf, passed as flags so no bind mount is needed on Dokploy.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "200mb",
              "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: [redis-data:/data]
    networks: [mkt]
    mem_limit: 256m

  migrate:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    command: ["pnpm", "--filter", "@mkt/db", "migrate"]
    environment: *app-env
    depends_on: { postgres: { condition: service_healthy } }
    networks: [mkt]
    restart: "no"

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    restart: unless-stopped
    environment: *app-env
    depends_on: { migrate: { condition: service_completed_successfully } }
    volumes: [mkt-data:/data]
    networks: [mkt, dokploy-network]
    mem_limit: 1g

  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    restart: unless-stopped
    environment:
      <<: *app-env
      REMOTION_CONCURRENCY: ${REMOTION_CONCURRENCY:-2}
      WORKER_ROLES: ${WORKER_ROLES:-all}
      SMOKESCREEN_URL: http://smokescreen:4750
    depends_on:
      migrate: { condition: service_completed_successfully }
      smokescreen: { condition: service_started }
    volumes: [mkt-data:/data]
    # mkt-capture: the internal-only network the SyllaCal demo instance joins (D26, M3b).
    networks: [mkt, mkt-capture]
    # tini as PID 1: forwards SIGTERM through pnpm/tsx and reaps Chromium/ffmpeg zombies.
    init: true
    shm_size: 1gb
    mem_limit: 5g
    cpus: 3
    stop_grace_period: 2m

  # Egress proxy for capture Chromium and safe-fetch: denies private/Docker/LAN/metadata ranges and SELF_IPS.
  smokescreen:
    build: { context: docker/smokescreen }
    restart: unless-stopped
    environment: { SELF_IPS: "${SELF_IPS}" }
    networks: [mkt]
    mem_limit: 64m

volumes:
  pg-data: {}
  redis-data: {}
  mkt-data: {}

networks:
  mkt: {}
  # Fixed name so the demo's compose file can join it as external; created on first deploy.
  mkt-capture: { name: mkt-capture }
  dokploy-network: { external: true }
